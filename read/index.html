---
layout: default
permalink: /read/
main_class: wide
sidebar: true
---
<div class="admin-bar" id="admin-bar" hidden>
  관리자로 보고 있어요 · <a id="admin-edit" href="#">이 호 편집하기</a> · 댓글을 바로 삭제할 수 있어요
</div>

<article class="issue">
  <header class="issue-head">
    <p class="issue-badge" id="issue-badge"></p>
    <h1 id="issue-title">불러오는 중이에요…</h1>
    <p class="issue-summary" id="issue-summary"></p>
  </header>
  <div class="blocks" id="issue-body"></div>
</article>

<section class="reactions" id="reactions" hidden>
  <div class="like-row">
    <button type="button" class="like-btn" id="like-btn" aria-pressed="false" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>
      <span class="like-label">좋아요</span>
      <span class="like-count" id="like-count">·</span>
    </button>
    <button type="button" class="share-btn" id="share-btn">공유하기</button>
  </div>

  <div class="comments">
    <h2>댓글 <span id="comment-count"></span></h2>
    <ul class="comment-list" id="comment-list">
      <li class="comment-empty">불러오는 중이에요…</li>
    </ul>

    <form class="comment-form" id="comment-form">
      <div class="form-row">
        <input id="comment-name" type="text" maxlength="20" placeholder="이름" required autocomplete="nickname">
        <input id="comment-pw" type="password" maxlength="30" placeholder="비밀번호 (수정·삭제용)" required autocomplete="new-password">
      </div>
      <textarea id="comment-text" maxlength="500" rows="3" placeholder="따뜻한 한마디를 남겨주세요" required></textarea>
      <div class="form-foot">
        <span class="form-msg" id="comment-msg"></span>
        <button type="submit" id="comment-submit" disabled>남기기</button>
      </div>
    </form>
  </div>
</section>

<nav class="issue-nav" id="issue-nav"></nav>

<script type="module" src="{{ '/assets/js/read.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
