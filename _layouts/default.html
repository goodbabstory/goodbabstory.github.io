<!doctype html>
<html lang="{{ site.lang }}">
<head>
{% include head.html %}
</head>
<body>
  <div class="site-header-wrap">
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/favicon.svg' | relative_url }}" alt="" width="28" height="28">
      <span>{{ site.title }}</span>
    </a>
    <a class="header-link" href="{{ '/#issues' | relative_url }}">지난 호</a>
  </header>
  </div>

  <main class="{{ page.main_class }}">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p class="footer-name">{{ site.publisher }}</p>
    <p>우리는 좋은 음식으로 더 나은 세상을 그립니다.</p>
    {% if site.kakao_channel != "" %}
    <a class="kakao-btn" href="{{ site.kakao_channel }}">카카오톡 채널 추가하기</a>
    {% endif %}
    <p class="footer-admin"><a href="{{ '/admin/' | relative_url }}">관리자</a> · v{{ site.version }}</p>
  </footer>
</body>
</html>
